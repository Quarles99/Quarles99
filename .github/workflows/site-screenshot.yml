name: Update example site screenshot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [site-updated]

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Quarles99/roofing-website-example
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture homepage hero
        run: |
          python3 -m http.server 8000 --directory site >/dev/null 2>&1 &
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          cat > shot.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
          await page.goto('http://localhost:8000/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(1000);
          await page.screenshot({ path: 'assets/roofing-example.png' });
          await browser.close();
          JS
          node shot.mjs
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/roofing-example.png
          git diff --cached --quiet || (git commit -m "Update example site screenshot" && git push)
